
      - name: Locate Gradle project
        run: |
          echo "Danh sach file trong ZIP:"
          find source -maxdepth 4 -type f | head -n 100

          GRADLE_FILE=$(find source -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Khong tim thay file Gradle"
            exit 1
          fi

          echo "Tim thay: $GRADLE_FILE"

      - name: Build Minecraft Mod
        run: |
          GRADLE_WRAPPER=$(find source -type f -name gradlew | head -n 1)

          if [ -n "$GRADLE_WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_WRAPPER")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew build
          else
            echo "ZIP khong co gradlew."
            echo "Can kiem tra cau hinh Gradle truoc khi build."
            exit 1
          fi
