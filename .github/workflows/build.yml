
name: Build SpruceAutoFarm

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check ZIP file
        run: |
          ls -lah
          test -f "SpruceAutoFarmv3full (1).zip"

      - name: Extract source ZIP
        run: |
          unzip -o "SpruceAutoFarmv3full (1).zip" -d source

      - name: Locate Gradle wrapper
        run: |
          find source -type f -name gradlew

      - name: Build Minecraft Mod
        run: |
          GRADLE_FILE=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Không tìm thấy gradlew trong ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpruceAutoFarm-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
