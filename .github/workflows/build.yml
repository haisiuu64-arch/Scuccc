
name: Build SpruceAutoFarm

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          unzip -o SpruceAutoFarmv3full.zip -d source

      - name: Find Gradle project
        run: |
          find . -name gradlew -type f

      - name: Build Mod
        run: |
          cd source
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpruceAutoFarm-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error

