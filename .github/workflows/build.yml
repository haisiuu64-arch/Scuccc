
name: Build SpruceAutoFarm

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          unzip -o "SpruceAutoFarmv3full (1).zip" -d source

      - name: Find Gradle project
        id: project
        run: |
          BUILD_FILE=$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "Khong tim thay build.gradle"
            find source -maxdepth 4 -type f | head -n 150
            exit 1
          fi

          echo "dir=$(dirname "$BUILD_FILE")" >> "$GITHUB_OUTPUT"

      - name: Build Mod
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpruceAutoFarm-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
