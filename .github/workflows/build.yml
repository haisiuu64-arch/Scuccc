
name: Build SpruceAutoFarm

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          unzip -o "SpruceAutoFarmv3full (1).zip" -d source

      - name: Inspect ZIP contents
        run: |
          echo "=== FILE LIST ==="
          find source -maxdepth 5 -type f | head -n 150
          echo "=== GRADLE FILES ==="
          find source -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Stop if Gradle project is missing
        run: |
          if ! find source -type f \( -name build.gradle -o -name build.gradle.kts \) | grep -q .; then
            echo "Khong tim thay build.gradle trong ZIP"
            exit 1
          fi
          if ! find source -type f -name gradlew | grep -q .; then
            echo "Du an chua co Gradle Wrapper"
            exit 1
          fi

      - name: Build Mod
        run: |
          GRADLE_FILE=$(find source -type f -name gradlew | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpruceAutoFarm-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
